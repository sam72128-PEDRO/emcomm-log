[package]
name = "emcomm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EMCOMM LOG persistence, validation, backup, package and export core"

[features]
default = []
fault-injection = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
csv = "1.4.0"
flate2 = "1.1.10"
hex = "0.4.3"
libc = "0.2.191"
lopdf = { version = "0.46.0", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ttf-parser = "0.25.1"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
emcomm-core = { path = ".", features = ["fault-injection"] }
tempfile = "3.27.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
# No libudev: Linux ports are found through /sys (USB and Bluetooth rfcomm still recognised).
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocation", "CLLocationManager"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.61.3", features = ["Devices_Geolocation", "Foundation"] }
