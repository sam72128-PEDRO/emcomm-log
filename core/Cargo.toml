[package]
name = "emcomm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "EMCOMM LOG persistence, validation, backup, package and export core"

[features]
default = []
fault-injection = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
csv = "1.4.0"
flate2 = "1.1.10"
hex = "0.4.3"
libc = "0.2.191"
lopdf = { version = "0.46.0", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ttf-parser = "0.25.1"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.2.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
emcomm-core = { path = ".", features = ["fault-injection"] }
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
